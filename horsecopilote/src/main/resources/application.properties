spring.application.name=horsecopilote

# Base de donnees (PostgreSQL via compose.yaml)
spring.datasource.url=jdbc:postgresql://localhost:5433/horsecopilote
spring.datasource.username=horse
spring.datasource.password=horse

# Le schema est gere par Flyway, Hibernate ne fait que valider
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway : migrations dans src/main/resources/db/migration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
