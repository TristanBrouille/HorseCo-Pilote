spring:
  application:
    name: horsecopilote

  # Profil par defaut en local : "dev" charge aussi les donnees de test (db/dev-data).
  # En production, definir SPRING_PROFILES_ACTIVE (ex. prod) pour ne jamais les charger.
  profiles:
    default: dev

  datasource:
    url: jdbc:postgresql://localhost:5433/horsecopilote
    username: horse
    password: horse

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

# Documentation de l'API : http://localhost:8080/swagger-ui.html
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
    with-credentials: true

app:
  cors:
    allowed-origins: "http://localhost:4200"

server:
  servlet:
    session:
      cookie:
        same-site: lax
        secure: true

