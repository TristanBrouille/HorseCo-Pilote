services:
  db:
    image: postgres:17
    container_name: horsecopilote-db
    environment:
      POSTGRES_DB: horsecopilote
      POSTGRES_USER: horse
      POSTGRES_PASSWORD: horse
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U horse -d horsecopilote"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
